name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned by major tag. Pinning to a commit SHA would be stricter against
      # a compromised action, at the cost of manual updates.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails when package-lock.json disagrees with
      # package.json instead of quietly resolving new versions.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
