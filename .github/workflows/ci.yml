name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not by tag: a tag can be moved to point at new
      # code, so `@v4` trusts whoever can push tags to that repository. The
      # trailing comment is what Dependabot reads to know which version this is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails when package-lock.json disagrees with
      # package.json instead of quietly resolving new versions.
      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Last, because it is the slowest, and because a broken build is useless
      # information until the code that goes into it is known to be sound.
      - run: npm run build
